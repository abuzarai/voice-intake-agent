name: family_english
tags:
- family
- english
scenarios:
- name: replay
  user:
    modality: audio
    speech:
      sample_rate: 16000
  context:
  - role: user
    content: Hello
  - role: assistant
    content: Hello. What kind of legal help do you need?
  - role: user
    content: My husband has left me. I want a khula divorce.
  - role: assistant
    content: Understood. What should I call you?
  - role: user
    content: You can call me Ayesha.
  - role: assistant
    content: Where do you live, Ayesha?
  - role: user
    content: In Lahore.
  - role: assistant
    content: Do you have children?
  - role: user
    content: Yes, two children, eight and five years old.
  - role: assistant
    content: How long has your husband been away?
  - role: user
    content: About a year.
  - role: assistant
    content: Is he paying child maintenance?
  - role: user
    content: No, fifty lakh rupees is owed and he pays nothing.
  - role: assistant
    content: What do you want?
  turns:
  - user: A khula and child maintenance.
    audio: ../../audio/family_english/01_answer.wav
    send_after:
      delay_ms: 1500
  - user: No, that is all.
    audio: ../../audio/family_english/02_closing.wav
  - expect:
    - event: function_call
      calls:
      - name: propose_draft
