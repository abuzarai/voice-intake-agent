name: partial_refusal
tags:
- partial_refusal
- english
scenarios:
- name: replay
  user:
    modality: audio
    speech:
      sample_rate: 16000
  context:
  - role: user
    content: Hello
  - role: assistant
    content: Hello. What legal help do you need?
  - role: user
    content: My employer has not paid my salary for three months.
  - role: assistant
    content: What should I call you?
  - role: user
    content: I don't want to give my name.
  - role: assistant
    content: How much is owed?
  - role: user
    content: Three lakh rupees.
  - role: assistant
    content: What do you want?
  turns:
  - user: I want my unpaid salary.
    audio: ../../audio/partial_refusal/01_answer.wav
    send_after:
      delay_ms: 1500
  - user: No, that is all.
    audio: ../../audio/partial_refusal/02_closing.wav
  - expect:
    - event: function_call
      calls:
      - name: propose_draft
