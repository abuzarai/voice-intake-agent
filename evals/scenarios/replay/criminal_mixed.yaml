scenarios:
- name: replay
  user:
    modality: audio
    speech:
      sample_rate: 16000
  context:
  - role: user
    content: Assalam o alaikum
  - role: assistant
    content: Walaikum assalam. Kya masla hai?
  - role: user
    content: Police ne mere bete ko custody mein liya hai aur FIR register nahi ki.
  - role: assistant
    content: Aap ka preferred name kya hai?
  - role: user
    content: Mujhe Rashid keh lein.
  - role: assistant
    content: Yeh kab aur kahan hua?
  - role: user
    content: Kal raat Gulberg thane mein.
  - role: assistant
    content: Kya aap ne koi lawyer kiya?
  - role: user
    content: Nahi, abhi tak kuch nahi kiya.
  - role: assistant
    content: Bete ka naam kya hai?
  - role: user
    content: Us ka naam Bilal hai.
  - role: assistant
    content: Aap kya chahte hain?
  turns:
  - user: Fori release aur FIR.
    audio: ../../audio/criminal_mixed/01_answer.wav
    send_after:
      delay_ms: 1500
  - user: Nahi, bas itna hi hai.
    audio: ../../audio/criminal_mixed/02_closing.wav
  - expect:
    - event: function_call
      calls:
      - name: propose_draft
