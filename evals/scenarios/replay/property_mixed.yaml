name: property_mixed
tags:
- property
- mixed
scenarios:
- name: replay
  user:
    modality: audio
    speech:
      sample_rate: 16000
  context:
  - role: user
    content: Assalam o alaikum
  - role: assistant
    content: Walaikum assalam. Kya legal help chahiye?
  - role: user
    content: Mere father ka inteqal ho gaya aur inheritance divide nahi hui.
  - role: assistant
    content: Aap ka preferred name kya hai?
  - role: user
    content: Mujhe Kamran keh lein.
  - role: assistant
    content: Property kahan hai?
  - role: user
    content: Lahore mein, ek plot hai.
  - role: assistant
    content: Kitne heirs hain?
  - role: user
    content: Teen betay aur do betiyan.
  - role: assistant
    content: Father ka inteqal kab hua?
  - role: user
    content: Two years ago.
  - role: assistant
    content: Property ki value kitni hai?
  - role: user
    content: About 50 lakh rupees.
  - role: assistant
    content: Aap kya chahte hain?
  turns:
  - user: Property mein mera rightful share.
    audio: ../../audio/property_mixed/01_answer.wav
    send_after:
      delay_ms: 1500
  - user: Nahi, bas itna hi hai.
    audio: ../../audio/property_mixed/02_closing.wav
  - expect:
    - event: function_call
      calls:
      - name: propose_draft
