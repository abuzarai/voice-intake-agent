name: property_english
tags:
- property
- english
- behaviour
scenarios:
- name: closure
  user:
    modality: audio
    speech:
      sample_rate: 16000
  context:
  - role: user
    content: Hello
  - role: assistant
    content: Hello. What kind of legal help do you need?
  - role: user
    content: My father passed away and the inheritance was not distributed.
  - role: assistant
    content: What should I call you?
  - role: user
    content: Call me Kamran.
  - role: assistant
    content: Where is the property?
  - role: user
    content: In Lahore, there is one plot.
  - role: assistant
    content: How many heirs are there?
  - role: user
    content: Three sons and two daughters.
  - role: assistant
    content: When did your father pass away?
  - role: user
    content: Two years ago.
  - role: assistant
    content: What is the property worth?
  - role: user
    content: About fifty lakh rupees.
  - role: assistant
    content: What do you want?
  - role: assistant
    content: Thank you. Is there anything else you would like to add?
  turns:
  - user: My rightful share of the property.
    audio: ../../audio/property_english/01_answer.wav
    send_after:
      delay_ms: 1500
  - user: No, that is all.
    audio: ../../audio/property_english/02_closing.wav
    expect:
    - event: function_call
      calls:
      - name: interview_finished
