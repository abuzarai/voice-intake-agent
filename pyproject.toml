[project]
name = "voice-intake-agent"
version = "1.0.0"
description = "Insafdaar bilingual voice intake agent (FastAPI + WebSockets + Gemini STT)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "google-genai>=1.0.0",
    "edge-tts>=7.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.26.0",
    "numpy>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.7",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
]